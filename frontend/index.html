<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soccer Goal Predictor | AI Match Analytics & Goal Predictions</title>
    <meta name="description" content="Soccer Goal Predictor application for match goal predictions and advanced analytics." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Unregister stale service workers & clear browser cache to fix blank screen caching issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let reg of registrations) {
            reg.unregister();
          }
        }).catch(function() {});
        if (window.caches) {
          caches.keys().then(function(names) {
            for (let name of names) caches.delete(name);
          }).catch(function() {});
        }
      }

      // Global script error listener fallback
      window.addEventListener('error', function(e) {
        console.error('Global Application Error:', e);
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="padding:2rem;color:#f8fafc;background:#020617;font-family:sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-center:center;">' +
            '<div style="max-width:400px;width:100%;padding:2rem;background:#0f172a;border:1px solid #1e293b;border-radius:1.5rem;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
            '<h2 style="font-size:1.25rem;font-weight:900;color:white;margin-bottom:0.5rem;">Soccer Goal Predictor</h2>' +
            '<p style="color:#94a3b8;font-size:0.75rem;margin-bottom:1.5rem;">The application experienced a loading issue (' + (e.message || 'Script Loading Error') + ').</p>' +
            '<button onclick="window.location.reload(true)" style="background:#059669;color:white;border:none;padding:0.75rem 1.5rem;border-radius:0.75rem;font-weight:bold;font-size:0.75rem;cursor:pointer;width:100%;">Reload Application</button>' +
            '</div></div>';
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
