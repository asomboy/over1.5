[tool.pyright]
venvPath = "."
venv = "venv"
include = ["."]
exclude = ["**/node_modules", "**/venv", "**/__pycache__", "dist"]
extraPaths = [
    ".",
    "venv/Lib/site-packages"
]

[tool.pyrefly]
venv_path = "venv"
site_package_path = ["venv/Lib/site-packages"]
search_paths = [".", "venv/Lib/site-packages"]

[tool.pyrefly.errors]
missing-import = "ignore"
bad-override = "ignore"
invalid-variance = "ignore"
