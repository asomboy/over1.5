[tool.pyright]
venvPath = "backend"
venv = "venv"
include = ["backend"]
exclude = ["**/node_modules", "**/venv", "**/__pycache__", "Lib", "dist"]
extraPaths = ["backend", "backend/venv/Lib/site-packages"]

[tool.pyrefly]
venv_path = "backend/venv"
site_package_path = ["backend/venv/Lib/site-packages"]
search_paths = ["backend", "backend/venv/Lib/site-packages"]

[tool.pyrefly.errors]
missing-import = "ignore"
bad-override = "ignore"
invalid-variance = "ignore"
