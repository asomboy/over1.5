# ==============================================================================
# Render Blueprint Configuration for Soccer Goal Predictor
# 
# IMPORTANT: Sensitive and instance-specific environment variables 
# (specifically FOOTBALL_API_KEY and DATABASE_URL) have sync: false.
# They MUST be manually configured in the Render Dashboard Environment settings
# for the soccer-goal-predictor-api service.
# ==============================================================================

services:
  # Backend FastAPI Web Service
  - type: web
    name: soccer-goal-predictor-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FOOTBALL_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Frontend Vite React Static Site
  - type: web
    name: soccer-goal-predictor-web
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
