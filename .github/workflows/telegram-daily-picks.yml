name: Automated Daily Goal Predictions Broadcast

on:
  schedule:
    # 2 Daily prediction broadcasts: Midnight GMT+1 (23:00 UTC) and Morning (07:00 UTC)
    - cron: '0 23,7 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  broadcast-predictions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Execute Telegram Daily Top 7 Picks Broadcast
        env:
          TELEGRAM_BOT_TOKEN: "8917826403:AAHNxYEicw76o_lPljmb6yy0LRGI8sC0S7Q"
          TELEGRAM_CHAT_ID: "568393640"
          API_BASE_URL: "https://soccer-goal-predictor-api.onrender.com"
        run: |
          python backend/scripts/broadcast_telegram.py
