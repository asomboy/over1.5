name: Keep Render Alive & Daily Sync

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier spin-down (buffers cron jitter)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  RENDER_API_URL: https://soccer-goal-predictor-api.onrender.com

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API to prevent spin-down
        run: |
          echo "Pinging Render API at $(date -u)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.RENDER_API_URL }}/api/system/health" --max-time 60)
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Server is alive (HTTP $HTTP_STATUS)"
          else
            echo "Server healthcheck failed with HTTP $HTTP_STATUS"
            exit 1
          fi

  daily-sync:
    runs-on: ubuntu-latest
    # Run once in the first 10-minute tick of UTC midnight (00:00-00:09) and noon (12:00-12:09)
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check if sync window matches
        id: check_time
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          MIN_INT=$((10#$MINUTE))
          echo "Current UTC time: ${HOUR}:${MINUTE}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { { [ "$HOUR" = "00" ] || [ "$HOUR" = "12" ]; } && [ "$MIN_INT" -lt 10 ]; }; then
            echo "sync_needed=true" >> $GITHUB_OUTPUT
          else
            echo "sync_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger full data sync
        if: steps.check_time.outputs.sync_needed == 'true'
        run: |
          echo "Triggering full data sync at $(date -u)..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "X-Admin-Key: ${{ secrets.ADMIN_API_KEY }}" \
            "${{ env.RENDER_API_URL }}/api/ingest/sync" \
            --max-time 120)
          echo "Sync response status: $HTTP_STATUS"
          cat response.json 2>/dev/null || true
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Daily sync completed successfully"
          else
            echo "Sync failed with HTTP $HTTP_STATUS"
            exit 1
          fi
