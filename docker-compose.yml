version: '3.8'

services:
  match-intelligence-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soccer-goal-predictor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/soccer.db
      - BACKUP_DIRECTORY=/app/data/backups
      - LOG_LEVEL=INFO
    volumes:
      - soccer_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  soccer_data:
